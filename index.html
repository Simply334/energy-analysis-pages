<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国智慧能源与能碳数据分析</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(135deg, #06101e 0%, #0a1a30 50%, #0c111b 100%);
    color: #e7eefc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    max-width: 800px;
    text-align: center;
  }
  h1 {
    font-size: 42px;
    background: linear-gradient(135deg, #25d0a6, #4ea5ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  .subtitle {
    color: #8ea3bf;
    font-size: 18px;
    margin-bottom: 48px;
    line-height: 1.6;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }
  .card {
    background: linear-gradient(180deg, rgba(16, 28, 47, 0.95), rgba(17, 29, 49, 0.95));
    border: 1px solid rgba(126, 211, 255, 0.12);
    border-radius: 22px;
    padding: 32px 28px;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s ease;
    box-shadow: 0 10px 28px rgba(0,0,0,0.16);
  }
  .card:hover {
    border-color: rgba(37, 208, 166, 0.4);
    transform: translateY(-4px);
    box-shadow: 0 18px 45px rgba(37, 208, 166, 0.12);
  }
  .card .icon {
    font-size: 40px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 22px;
    margin-bottom: 10px;
    color: #fff;
  }
  .card p {
    color: #8ea3bf;
    font-size: 14px;
    line-height: 1.6;
  }
  .card .tag {
    display: inline-block;
    margin-top: 16px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(37, 208, 166, 0.12);
    color: #25d0a6;
    border: 1px solid rgba(37, 208, 166, 0.25);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>中国智慧能源与能碳数据分析</h1>
  <p class="subtitle">智慧能源行业深度研究与数据产品市场分析</p>
  <div class="cards">
    <a href="analysis.html" class="card">
      <div class="icon">📊</div>
      <h2>数据分析体系报告</h2>
      <p>覆盖数据采集、指标体系、分析框架、模型算法的完整智慧能源与能碳数据分析体系网页报告</p>
      <span class="tag">查看报告 →</span>
    </a>
    <a href="market.html" class="card">
      <div class="icon">📈</div>
      <h2>数据产品市场分析</h2>
      <p>中国智慧能源与能碳数据产品市场全景分析，含市场竞争格局、产品矩阵、商业模式等</p>
      <span class="tag">查看分析 →</span>
    </a>
  </div>
</div>
</body>
</html>
